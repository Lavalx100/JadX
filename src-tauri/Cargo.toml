[package]
name = "jadx"
version = "0.1.0"
description = "A local-first macOS AI desktop harness for LM Studio"
authors = ["JadX"]
edition = "2021"

[lib]
name = "jadx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.2", features = [] }
tauri-plugin-dialog = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "6.0"
keyring = { version = "3.6", features = ["apple-native"] }
regex = "1.11"
url = "2.5"
base64 = "0.22"
json5 = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"
